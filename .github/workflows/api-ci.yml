name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'backend/api/**'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: npm run check
      - name: Build container
        run: docker build -t ai-workspace-pro-api:ci .
