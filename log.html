<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>System Log — AI Workspace Pro</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/auth.css"><link rel="stylesheet" href="assets/css/responsive.css"></head>
<body>
<header class="site-header glass"><a href="index.html#/dashboard" class="brand">AI Workspace Pro</a><nav aria-label="Log navigation"><a href="index.html#/chat">Chat</a><a href="history.html">History</a><a href="admin.html">Admin</a></nav></header>
<main class="page-shell system-page"><section class="glass-card"><div class="section-heading"><div><p class="eyebrow">DIAGNOSTICS</p><h1>Audit & Console Logs</h1><p>Browser-side structured events. Server logs are intentionally not exposed by this static client.</p></div><span id="log-count" class="count-badge">0 events</span></div>
<div class="log-toolbar"><label>Search<input id="log-search" type="search" placeholder="Search type, message or metadata…" autocomplete="off"></label><label>Category<select id="log-filter"><option value="all">All</option><option value="info">Info</option><option value="warning">Warning</option><option value="error">Error</option></select></label><button id="export-log" class="btn btn-secondary" type="button">Export JSON</button><button id="clear-log" class="btn btn-danger" type="button">Clear</button></div>
<div class="audit-table-wrapper"><table class="audit-table"><thead><tr><th>Time</th><th>Type</th><th>Message</th><th>Metadata</th></tr></thead><tbody id="log-body"></tbody></table></div><div id="empty-logs" class="empty-state">No matching audit events.</div></section></main>
<script>
const KEY='ai-workspace.audit-log',body=document.getElementById('log-body'),empty=document.getElementById('empty-logs'),count=document.getElementById('log-count'),search=document.getElementById('log-search'),filter=document.getElementById('log-filter');
const read=()=>{try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}};
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const severity=e=>{const s=String(e.severity||e.type||'').toLowerCase();if(s.includes('error')||s.includes('fail'))return'error';if(s.includes('warn')||s.includes('timeout'))return'warning';return'info'};
function render(){const q=search.value.trim().toLowerCase(),f=filter.value;const rows=read().filter(e=>{const s=severity(e);return(f==='all'||s===f)&&(!q||JSON.stringify(e).toLowerCase().includes(q))}).reverse();body.innerHTML='';count.textContent=`${rows.length} event${rows.length===1?'':'s'}`;empty.hidden=rows.length>0;for(const e of rows){const tr=document.createElement('tr'),meta=JSON.stringify(e.meta??e.metadata??{});tr.innerHTML=`<td>${esc(new Date(e.time||e.timestamp||Date.now()).toLocaleString())}</td><td><span class="log-tag log-${severity(e)}">${esc(e.type||severity(e).toUpperCase())}</span></td><td>${esc(e.message||'')}</td><td><code>${esc(meta)}</code></td>`;body.appendChild(tr)}}
search.addEventListener('input',render);filter.addEventListener('change',render);document.getElementById('clear-log').addEventListener('click',()=>{if(confirm('Permanently clear all local audit logs?')){localStorage.removeItem(KEY);render()}});document.getElementById('export-log').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(read(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`ai-workspace-audit-${Date.now()}.json`;a.click();URL.revokeObjectURL(url)});window.addEventListener('storage',e=>{if(e.key===KEY)render()});window.addEventListener('auth:audit',render);render();
</script></body></html>
