<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>History — AI Workspace Pro</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/auth.css"><link rel="stylesheet" href="assets/css/responsive.css"></head>
<body><header class="site-header glass"><a href="index.html#/dashboard" class="brand">AI Workspace Pro</a><nav aria-label="History navigation"><a href="index.html#/chat">Chat</a><a href="index.html#/dashboard">Dashboard</a><a href="log.html">System Log</a></nav></header>
<main class="page-shell system-page"><section class="glass-card"><div class="section-heading"><div><p class="eyebrow">ARCHIVE</p><h1>Activity History</h1><p>Locally archived workspace activity metadata.</p></div><span id="history-count" class="count-badge">0 events</span></div>
<div class="history-toolbar"><label>Search<input id="history-search" type="search" placeholder="Search activity…" autocomplete="off"></label><label>Action<select id="history-filter"><option value="all">All actions</option></select></label><button id="export-json" class="btn btn-secondary" type="button">Export JSON</button><button id="export-csv" class="btn btn-secondary" type="button">Export CSV</button><button id="clear-history" class="btn btn-danger" type="button">Clear History</button></div>
<div class="audit-table-wrapper"><table class="audit-table"><thead><tr><th>Date</th><th>Action</th><th>Metadata</th></tr></thead><tbody id="history-body"></tbody></table></div><div class="history-pagination"><button id="prev-page" class="btn btn-secondary" type="button">Previous</button><span id="page-label">Page 1</span><button id="next-page" class="btn btn-secondary" type="button">Next</button></div><div id="empty-history" class="empty-state">No matching activity history.</div></section></main>
<script>
const KEY='ai-workspace.history',body=document.getElementById('history-body'),empty=document.getElementById('empty-history'),count=document.getElementById('history-count'),search=document.getElementById('history-search'),filter=document.getElementById('history-filter'),pageLabel=document.getElementById('page-label');let page=1;const size=25;
const read=()=>{try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}};const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function filtered(){const q=search.value.trim().toLowerCase(),f=filter.value;return read().filter(x=>(f==='all'||x.action===f)&&(!q||JSON.stringify(x).toLowerCase().includes(q))).reverse()}
function populateFilters(){const actions=[...new Set(read().map(x=>x.action).filter(Boolean))].sort();filter.innerHTML='<option value="all">All actions</option>'+actions.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
function render(){const all=filtered(),pages=Math.max(1,Math.ceil(all.length/size));page=Math.min(page,pages);const rows=all.slice((page-1)*size,page*size);body.innerHTML='';count.textContent=`${all.length} event${all.length===1?'':'s'}`;pageLabel.textContent=`Page ${page} of ${pages}`;document.getElementById('prev-page').disabled=page<=1;document.getElementById('next-page').disabled=page>=pages;empty.hidden=rows.length>0;for(const x of rows){const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(new Date(x.createdAt||x.timestamp||Date.now()).toLocaleString())}</td><td><span class="activity-tag">${esc(x.action||'UNKNOWN')}</span></td><td><code>${esc(JSON.stringify(x.metadata??x.meta??{}))}</code></td>`;body.appendChild(tr)}}
function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
document.getElementById('export-json').onclick=()=>download(`ai-workspace-history-${Date.now()}.json`,JSON.stringify(read(),null,2),'application/json');document.getElementById('export-csv').onclick=()=>{const rows=[['id','createdAt','action','metadata'],...read().map(x=>[x.id||'',x.createdAt||x.timestamp||'',x.action||'',JSON.stringify(x.metadata??x.meta??{})])];download(`ai-workspace-history-${Date.now()}.csv`,rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),'text/csv;charset=utf-8')};
search.oninput=()=>{page=1;render()};filter.onchange=()=>{page=1;render()};document.getElementById('prev-page').onclick=()=>{page--;render()};document.getElementById('next-page').onclick=()=>{page++;render()};document.getElementById('clear-history').onclick=()=>{if(confirm('Permanently delete all local activity history?')){localStorage.removeItem(KEY);page=1;populateFilters();render()}};window.addEventListener('storage',e=>{if(e.key===KEY){populateFilters();render()}});window.addEventListener('auth:audit',render);populateFilters();render();
</script></body></html>
