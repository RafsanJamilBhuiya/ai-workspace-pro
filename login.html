<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-client-id" content="1009455911830-sd9jb0mq47iobfqcnmlnbec43padb0oe.apps.googleusercontent.com">
  <title>Sign in — AI Workspace Pro</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card glass-card" aria-labelledby="login-title">
      <p class="eyebrow">AI Workspace Pro</p>
      <h1 id="login-title">Sign in with Google</h1>
      <p>Authorize Drive and Sheets access for your workspace.</p>
      <div id="google-signin" aria-label="Google sign in"></div>
      <p id="auth-status" class="auth-status" role="status" aria-live="polite">Loading authentication…</p>
      <a href="index.html#/dashboard">Return to workspace</a>
    </section>
  </main>
  <script type="module">
    import { initGoogleAuth, isAuthenticated } from './assets/js/auth.js';
    const status = document.getElementById('auth-status');
    if (isAuthenticated()) status.textContent = 'An active session already exists.';
    window.addEventListener('auth:ready', () => {
      status.textContent = 'Signed in successfully.';
      setTimeout(() => { location.href = 'index.html#/dashboard'; }, 250);
    }, { once: true });
    try { initGoogleAuth(); }
    catch (error) { status.textContent = error.message || 'Authentication configuration is unavailable.'; }
  </script>
</body>
</html>
